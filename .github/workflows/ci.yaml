name: CI

on:
  push:
    branches: 
      - feature/**
      - fix/**
  pull_request:
    branches: 
      - feature/**
      - fix/**
      
jobs:
  build_and_test:
    runs-on: ubuntu-latest
    env:
      PROFILE: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up JDK 17
        uses: actions/setup-java@v2
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Maven dependencies
        uses: actions/cache@v2
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Check and Replace Properties File
        run: |
          if [ $PROFILE == "test" ]; then
            cp -f pokedex/src/main/resources/application-test.properties pokedex/src/main/resources/application.properties
          fi
          
      - name: Build and Test with Maven
        run: mvn -B -f pokedex/pom.xml clean verify

 create_tag:
    runs-on: ubuntu-latest
    needs: build_and_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Determine Version Increment
        id: determine_version
        run: |
         if git log -1 --pretty=%B | grep -iq '\[major\]'; then
          echo "::set-output name=version_increment::major"
        elif git log -1 --pretty=%B | grep -iq '\[minor\]'; then
          echo "::set-output name=version_increment::minor"
        else
          echo "::set-output name=version_increment::patch"
        fi

      - name: Create tag
        id: create_tag
        run: |
          VERSION_INCREMENT=${{ steps.determine_version.outputs.version_increment }}
          LATEST_TAG=$(git describe --tags `git rev-list --tags --max-count=1` 2>/dev/null || echo "v0.0.0")
          echo "Latest tag: $LATEST_TAG"

          LATEST_TAG=${LATEST_TAG#v}

          IFS='.' read -r -a TAG_PARTS <<< "$LATEST_TAG"

          MAJOR="${TAG_PARTS[0]}"
          MINOR="${TAG_PARTS[1]}"
          PATCH="${TAG_PARTS[2]}"

          if [ "$VERSION_INCREMENT" == "major" ]; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
          elif [ "$VERSION_INCREMENT" == "minor" ]; then
            MINOR=$((MINOR + 1))
            PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi

          NEW_TAG="v$MAJOR.$MINOR.$PATCH"
          echo "New tag: $NEW_TAG"

          echo "::set-output name=new_tag::$NEW_TAG"

          git config user.name "github-actions"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git tag $NEW_TAG
          git push origin $NEW_TAG
          
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}